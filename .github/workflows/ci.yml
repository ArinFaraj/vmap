name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub get --directory vmap_flutter_map
      - run: flutter pub get --directory example
      - run: flutter pub get --directory bench
      - run: dart format --output=none --set-exit-if-changed lib test tool bench/lib example/lib example/test vmap_flutter_map
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: vmap_flutter_map
      - run: flutter test
        working-directory: example
      - run: dart pub publish --dry-run

  example-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build web
        working-directory: example

  example-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --debug
        working-directory: example
