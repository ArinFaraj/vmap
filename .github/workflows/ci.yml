name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub get --directory vmap_flutter_map
      - run: dart format --output=none --set-exit-if-changed lib test tool bench/lib vmap_flutter_map
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: vmap_flutter_map
      - run: dart pub publish --dry-run
