name: Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: demo
      - run: >-
          flutter build web --wasm --release --no-tree-shake-icons
          --no-web-resources-cdn --pwa-strategy=none --base-href /vmap/
        working-directory: demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tool/style_compare
      - run: flutter pub get
        working-directory: bench
      - run: >-
          flutter build web --wasm --release --no-tree-shake-icons
          --no-web-resources-cdn --pwa-strategy=none --base-href /vmap/compare/
          -t lib/compare_web.dart -o ../demo/build/web/compare
        working-directory: bench
      - run: |
          out=demo/build/web/compare
          mkdir -p "$out/dist"
          cp tool/style_compare/node_modules/maplibre-gl/dist/maplibre-gl.mjs \
             tool/style_compare/node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs \
             tool/style_compare/node_modules/maplibre-gl/dist/maplibre-gl.css "$out/dist/"
          cp tool/style_compare/node_modules/@mapbox/mapbox-gl-rtl-text/dist/mapbox-gl-rtl-text.js "$out/rtl.js"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
