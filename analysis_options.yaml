include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/src/gpu/gpu_shim/web/shader_bundle_generated.dart
  errors:
    # The shader bundle asset is written by hook/build.dart when an app
    # builds, so a fresh checkout does not have it.
    asset_does_not_exist: ignore

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
