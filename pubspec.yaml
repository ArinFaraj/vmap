name: vmap
description: >-
  A map engine for Flutter drawn on the GPU: any MapLibre style, 3D buildings,
  terrain and the globe, labels in every script, on every platform.
version: 0.27.0
repository: https://github.com/ArinFaraj/vmap
issue_tracker: https://github.com/ArinFaraj/vmap/issues
topics:
  - map
  - maps
  - maplibre
  - vector-tiles
  - gpu

screenshots:
  - description: Erbil's citadel in 3D, in OpenFreeMap's Liberty style.
    path: doc/screenshots/hero.webp
  - description: Erbil in vmap's built in style, with Kurdish street names.
    path: doc/screenshots/builtin.webp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.1"

dependencies:
  dart_earcut: ^1.2.0
  flat_buffers: ^25.9.23
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  latlong2: ">=0.9.0 <0.11.0"
  hooks: ^2.0.0
  vector_math: ^2.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/atmosphere.frag
    - shaders/sky.frag
  assets:
    - build/shaderbundles/vmap_gpu.shaderbundle
    - assets/fonts/Vazirmatn-Variable.ttf
    - assets/fonts/NotoSansSyriacEastern-Variable.ttf
    - path: assets/vmap_worker.js
      platforms:
        - web
