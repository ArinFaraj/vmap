name: vmap
description: >-
  Vector maps for flutter_map: draws any MapLibre style with the plain Flutter
  canvas, with labels in every script, pins, overlays and offline tiles.
version: 0.26.0
repository: https://github.com/ArinFaraj/vmap
issue_tracker: https://github.com/ArinFaraj/vmap/issues
topics:
  - map
  - maps
  - flutter-map
  - vector-tiles
  - maplibre

screenshots:
  - description: One place in Erbil drawn in three styles by vmap.
    path: doc/screenshots/hero.webp
  - description: The example app in a light and a dark style.
    path: doc/screenshots/app.webp

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.1"

dependencies:
  dart_earcut: ^1.2.0
  flat_buffers: ^25.9.23
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  flutter_gpu_shaders: ^0.5.2
  latlong2: ">=0.9.0 <0.11.0"
  hooks: ^2.0.0
  payv: 0.1.2
  vector_math: ^2.2.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.vmap.vmap
        pluginClass: VmapPlugin
  shaders:
    - shaders/atmosphere.frag
    - shaders/sky.frag
  assets:
    - build/shaderbundles/vmap_gpu.shaderbundle
    - assets/fonts/Vazirmatn-Variable.ttf
    - assets/fonts/NotoSansSyriacEastern-Variable.ttf
    - path: assets/vmap_worker.js
      platforms:
        - web
