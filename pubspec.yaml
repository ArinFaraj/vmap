name: vmap
description: A vector tile layer for flutter_map that draws any MapLibre style with the Flutter canvas.
version: 0.14.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  dart_earcut: ^1.2.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.0
  latlong2: ">=0.9.0 <0.11.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
