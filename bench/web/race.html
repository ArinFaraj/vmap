<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vmap race</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    iframe { display: block; border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <iframe id="map" title="map"></iframe>
  <script>
    // One map alone in the window, vmap (index.html) or MapLibre GL JS
    // (maplibre.html), for tool/web_race.mjs to load and fly through
    // the same views: race.load(target, view) then race.fly(name).
    const frame = document.getElementById('map');
    const style = 'https://tiles.openfreemap.org/styles/liberty';
    const marks = [];
    addEventListener('message', (e) => {
      if (e.source === frame.contentWindow && e.data?.type) {
        marks.push({type: e.data.type, at: performance.now()});
      }
    });
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const until = async (test, ms) => {
      const end = performance.now() + ms;
      while (performance.now() < end) {
        const hit = test();
        if (hit) return hit;
        await wait(20);
      }
      return null;
    };

    const ease = (t) => t * t * (3 - 2 * t);
    const orbit = (center, zoom, pitch, bearing, turn) => (t) =>
      ({lng: center[0], lat: center[1], zoom, pitch, bearing: bearing + turn * t});
    const keyframes = (keys) => (t) => {
      let i = 0;
      while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
      const [t0, ...a] = keys[i];
      const [t1, ...b] = keys[i + 1];
      const k = ease(Math.min(1, Math.max(0, (t - t0) / (t1 - t0))));
      const mix = (j) => a[j] + (b[j] - a[j]) * k;
      return {lng: mix(0), lat: mix(1), zoom: mix(2), pitch: mix(3), bearing: mix(4)};
    };
    const views = {
      erbil3d: {seconds: 12, at: orbit([44.0092, 36.1912], 16.5, 60, -25, 20)},
      city: {seconds: 12, at: orbit([-74.0113, 40.7069], 15.7, 72, 28, 20)},
      globe: {seconds: 12, globe: true,
        at: (t) => ({lng: 40 + 25 * t, lat: 30, zoom: 1.6, pitch: 0, bearing: 0})},
      flight: {seconds: 16, at: keyframes([
        [0, 43.95, 36.15, 11, 0, 0],
        [4, 44.0092, 36.1912, 14.5, 30, 20],
        [8, 44.0092, 36.1912, 16.5, 60, 90],
        [11, 44.03, 36.21, 15, 50, 160],
        [16, 44.25, 36.0, 10.5, 0, 200],
      ])},
    };

    let target = null;
    const presents = [];
    const move = (c) => {
      if (target === 'vmap') {
        frame.contentWindow.postMessage({type: 'camera', ...c}, '*');
      } else {
        frame.contentWindow.__mlmap.jumpTo(
          {center: [c.lng, c.lat], zoom: c.zoom, pitch: c.pitch, bearing: c.bearing});
      }
    };
    const vmapStats = (reset) => new Promise((done) => {
      const heard = (e) => {
        if (e.data?.type !== 'stats') return;
        removeEventListener('message', heard);
        done(e.data);
      };
      addEventListener('message', heard);
      frame.contentWindow.postMessage({type: 'stats?', reset}, '*');
    });

    // Frames the map handed to the screen and the main thread time each
    // took in the map's own code: vmap's engine paint, MapLibre's _render.
    // vmap's figure leaves out Flutter's own frame work.
    let workMicros = 0, workFrames = 0;
    const hook = () => {
      const w = frame.contentWindow;
      if (target === 'vmap') {
        const proto = w.ImageBitmapRenderingContext.prototype;
        const present = proto.transferFromImageBitmap;
        proto.transferFromImageBitmap = function (bitmap) {
          presents.push(performance.now());
          return present.call(this, bitmap);
        };
      } else {
        const map = w.__mlmap;
        const render = map._render.bind(map);
        map._render = (...args) => {
          const t = performance.now();
          const out = render(...args);
          const now = performance.now();
          workMicros += (now - t) * 1000;
          workFrames++;
          presents.push(now);
          return out;
        };
      }
    };

    // Loads the map at the first camera of [view] and resolves when it
    // says it drew everything: vmap's onIdle, MapLibre's idle event.
    const load = async (which, view) => {
      target = which;
      const v = views[view];
      const c = v.at(0);
      marks.length = 0;
      const page = which === 'vmap' ? 'index.html' : 'maplibre.html';
      const start = performance.now();
      frame.src = `${page}?style=${encodeURIComponent(style)}&lat=${c.lat}&lng=${c.lng}` +
        `&zoom=${c.zoom}&pitch=${c.pitch}&bearing=${c.bearing}${v.globe ? '&globe=1' : ''}`;
      const styled = await until(() => marks.find((m) => m.type === 'style'), 60000);
      const idle = await until(() => marks.find((m) => m.type === 'idle' && styled && m.at > styled.at), 60000);
      await until(() => frame.contentWindow?.ImageBitmapRenderingContext, 1000);
      if (which === 'maplibre') await until(() => frame.contentWindow.__mlmap, 5000);
      hook();
      return {
        styleMs: styled ? Math.round(styled.at - start) : null,
        idleMs: idle ? Math.round(idle.at - start) : null,
      };
    };

    // Jumps to the first camera of [view], waits for the map to finish
    // drawing it, then moves the camera every frame for the view's run.
    const fly = async (view) => {
      const v = views[view];
      move(v.at(0));
      marks.length = 0;
      await until(() => marks.find((m) => m.type === 'idle'), 20000);
      await wait(1000);
      const rafs = [];
      await new Promise((done) => {
        let last = 0;
        const tick = (now) => {
          if (last) rafs.push(now - last);
          last = now;
          if (rafs.length >= 30) return done();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
      const refresh = [...rafs].sort((a, b) => a - b)[15];
      if (target === 'vmap') await vmapStats(true);
      workMicros = workFrames = 0;
      presents.length = 0;
      const start = performance.now();
      let end = start;
      await new Promise((done) => {
        const tick = (now) => {
          const t = (performance.now() - start) / 1000;
          if (t >= v.seconds) {
            end = performance.now();
            return done();
          }
          move(v.at(t));
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
      const shown = presents.filter((p) => p >= start && p <= end);
      const gaps = shown.slice(1).map((p, i) => p - shown[i]);
      const sorted = [...gaps].sort((a, b) => a - b);
      const q = (p) => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))] ?? null;
      const seconds = (end - start) / 1000;
      const expected = seconds * 1000 / refresh;
      const r2 = (x) => x == null ? null : Math.round(x * 100) / 100;
      let work = workFrames ? workMicros / workFrames / 1000 : null;
      if (target === 'vmap') {
        const s = await vmapStats(false);
        work = s.frames ? s.paintMicros / s.frames / 1000 : null;
      }
      return {
        refreshMs: r2(refresh),
        fps: r2(shown.length / seconds),
        p50: r2(q(0.5)), p95: r2(q(0.95)), p99: r2(q(0.99)), max: r2(sorted.at(-1)),
        missedPct: r2(Math.max(0, 1 - shown.length / expected) * 100),
        longFrames: gaps.filter((g) => g > refresh * 1.5).length,
        workMs: r2(work),
      };
    };

    // Everything this page and the map in it hold: JS heaps, WebAssembly
    // memory and workers. GPU memory is not counted.
    const memory = async () => {
      const m = await performance.measureUserAgentSpecificMemory();
      return Math.round(m.bytes / 1048576);
    };
    window.race = {load, fly, memory, views};
  </script>
</body>
</html>
