<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MapLibre GL JS</title>
  <link rel="stylesheet" href="dist/maplibre-gl.css">
  <style>html, body, #map { margin: 0; width: 100%; height: 100%; }</style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import * as m from './dist/maplibre-gl.mjs';
    const maplibregl = m.default ?? m;
    await maplibregl.setRTLTextPlugin(new URL('rtl.js', location).href, false);
    const q = new URLSearchParams(location.search);
    const num = (key, fallback) => Number(q.get(key) ?? fallback);
    const map = new maplibregl.Map({
      container: 'map',
      style: q.get('style') ?? 'https://tiles.openfreemap.org/styles/liberty',
      center: [num('lng', 44.0092), num('lat', 36.1912)],
      zoom: num('zoom', 14),
      bearing: num('bearing', 0),
      pitch: num('pitch', 0),
      maxPitch: 85,
    });
    const mark = (type) => postMessage({type, at: performance.now()}, '*');
    map.once('style.load', () => mark('style'));
    map.on('idle', () => mark('idle'));
    window.__mlmap = map;
  </script>
</body>
</html>
