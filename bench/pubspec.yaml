name: vmap_bench
description: "vmap's benchmark tour, render test runner and comparison pages."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_displaymode: ^0.7.0
  flutter_gpu:
    sdk: flutter
  flutter_map: ^8.3.2
  material_ui: ^1.11.0
  path_provider: ^2.1.6
  vector_map_tiles: 9.0.0-beta.13
  vector_math: ^2.2.0
  vmap:
    path: ..
  vmap_flutter_map:
    path: ../vmap_flutter_map
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bench_labels.json
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
